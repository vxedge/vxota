[workspace]
resolver = "3"
members = [
    "crates/vxota-common",
    "crates/vxota",
    "crates/vxota-probe",
]

[workspace.package]
publish = false
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/vxedge/vxota"

[workspace.dependencies]
vxota-common = { path = "crates/vxota-common" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "io-util", "signal"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
# reqwest 0.13 leaves the TLS crypto provider to the program; vxota keeps rustls' `ring` provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "3", features = ["rand_core", "serde"] }
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
